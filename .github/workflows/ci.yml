name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: statewalker/statewalker-ci/.github/workflows/ci.yml@main
    with:
      # An app baseline (build and typecheck required), not library: there is no test suite,
      # the extension is exercised by hand through examples/.
      baseline: app
      package-checks: true
      api-diff: true
      secret-scan: true
      release-path: true
      test-command: pnpm run --if-present test

  # The lockfile-only pull request that .github/workflows/statewalker-update.yml opens: merged
  # once every other check on it passes, after checking it changes pnpm-lock.yaml alone
  # (statewalker/statewalker-ci's merge-lockfile.yml; statewalker-root docs/process/merging.md).
  lockfile:
    needs: ci
    # !cancelled(): also after a failed check job, so the pull request gets a comment saying why.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.head_ref == 'deps/statewalker-lockfile' }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    uses: statewalker/statewalker-ci/.github/workflows/merge-lockfile.yml@main
    secrets: inherit

  # Releases to npm in three jobs: `version` opens the version pull request, `pack` packs what
  # npm lacks once it is merged, `publish` uploads the tarballs. Nobody approves the upload:
  # merging the version pull request is the release decision.
  #
  # No npm token is stored in GitHub: `publish` authenticates with trusted publishing (OIDC),
  # and its provenance attestation ties each tarball to this commit. npm's trusted publishers
  # name this file (ci.yml) and the `npm` environment, which admits only `main`, so a run from
  # another branch cannot publish. Only `publish` may request an identity token, and it never
  # checks out, installs or builds: no build tool or dependency runs where a publish token can
  # be obtained.
  #
  # A trusted publisher can only be added to a package that exists, so a package's first
  # version is published by hand, with the maintainer's 2FA, before the version pull request
  # that releases it merges; `pack` or `publish` then skips it.

  # Writes the changesets nobody wrote by hand (statewalker/statewalker-ci's
  # scripts/release-changesets.mjs: a patch for every package whose packed files or published
  # manifest differ from npm's `latest`, a minor (0.x) / major when a dependency moved to another
  # breaking line), then opens or updates the "chore: version packages" pull request. Never
  # publishes.
  version:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release scripts
        uses: actions/checkout@v7
        with:
          repository: statewalker/statewalker-ci
          ref: main
          path: .statewalker-ci

      - name: Move the release scripts out of the workspace
        run: mv .statewalker-ci "$RUNNER_TEMP/statewalker-ci"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run --if-present build

      - name: Changesets for unreleased changes
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/release-changesets.mjs"

      # The version pull request is opened and pushed with the statewalker-release GitHub App's
      # installation token, not GITHUB_TOKEN: GitHub does not run CI on what GITHUB_TOKEN pushes
      # (the run waits as "action_required" until a maintainer approves it), so the pull request
      # would have no checks for the merge gate or a required status check. The App (Contents and
      # Pull requests: read & write) is installed on each publishing repository; its client id is
      # the organization variable RELEASE_APP_CLIENT_ID and its private key the organization secret
      # RELEASE_APP_KEY, both visible only to those repositories. The token is scoped to this
      # repository and revoked when the job ends.
      - name: Release token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Version pull request
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.release-token.outputs.token }}
          version-script: pnpm exec changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  # Nothing pending (the version pull request was merged): packs every public package whose
  # version is not on npm. No credentials.
  pack:
    needs: version
    if: needs.version.outputs.pending == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any: ${{ steps.pack.outputs.any }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run --if-present build

      # `pnpm pack` writes the published manifest: workspace: and catalog: become version ranges.
      - name: Pack what npm lacks
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for dir in ./; do
            read -r name version private < <(node -p "const p=require('./${dir}package.json');[p.name,p.version,!!p.private].join(' ')")
            [ "$private" = true ] && continue
            npm view "$name@$version" version >/dev/null 2>&1 && continue
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/out")
          done
          ls "$RUNNER_TEMP/out"/*.tgz >/dev/null 2>&1 && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"

      - if: steps.pack.outputs.any == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ runner.temp }}/out/*.tgz

  # Runs in the `npm` environment (only `main`, no approval) and publishes the tarballs packed
  # above with OIDC, tagging each one as a GitHub release.
  publish:
    needs: pack
    if: needs.pack.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Pinned: trusted publishing needs npm 11.5.1 or later.
      - name: npm
        run: npm install --global npm@11.19.0 && npm --version

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      # Skips a version already on npm: a first version published by hand after the tarballs were
      # packed, or what an earlier attempt of a re-run job published. Publishes in dependency
      # order, so a package never reaches npm before a new version it depends on.
      # A version older than npm's `latest` (an old run re-run after a newer release) is
      # published under the `backport` dist-tag, and a prerelease under `next`, so `latest` never
      # moves backwards. Only npm's "not found" (E404) counts as no `latest`; any other failure to
      # read it stops the step rather than publish blind.
      # One package that npm refuses (typically a 404 on the PUT: no trusted publisher is set up
      # for it on npmjs.com) no longer stops the others: it is reported, the packages that depend
      # on it are held back, the rest are published, and the step fails at the end with a list.
      - name: Publish
        id: publish
        run: |
          : > "$RUNNER_TEMP/on-npm"
          order=$(node -e '
            const { execFileSync } = require("node:child_process");
            const files = process.argv.slice(1);
            const pkg = new Map(files.map((f) => [f, JSON.parse(execFileSync("tar", ["-xzOf", f, "package/package.json"]))]));
            const byName = new Map([...pkg].map(([f, p]) => [p.name, f]));
            const out = [], seen = new Set();
            const visit = (f) => {
              if (seen.has(f)) return;
              seen.add(f);
              const p = pkg.get(f);
              for (const d of Object.keys({ ...p.dependencies, ...p.peerDependencies, ...p.optionalDependencies })) if (byName.has(d)) visit(byName.get(d));
              out.push(f);
            };
            files.forEach(visit);
            console.log(out.join("\n"));
          ' packages/*.tgz)
          failed=()
          published_now=()
          # Written on every way out of the step, an early `exit 1` included, so `notify` announces
          # whatever did reach npm.
          trap 'echo "published=${published_now[*]}" >> "$GITHUB_OUTPUT"' EXIT
          for t in $order; do
            read -r name version deps < <(tar -xzOf "$t" package/package.json | node -p "const p=JSON.parse(require('fs').readFileSync(0));[p.name,p.version,Object.keys({...p.dependencies,...p.peerDependencies,...p.optionalDependencies}).join(',')].join(' ')")
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version: already on npm"; echo "$name@$version" >> "$RUNNER_TEMP/on-npm"; continue; fi
            blocked=""
            for f in "${failed[@]}"; do [[ ",$deps," == *",${f%@*},"* ]] && blocked="${f%@*}"; done
            if [ -n "$blocked" ]; then echo "::error::$name@$version held back: it depends on $blocked, which was not published"; failed+=("$name@$version"); continue; fi
            if ! latest=$(npm view "$name" dist-tags.latest 2>"$RUNNER_TEMP/view.err"); then
              grep -q E404 "$RUNNER_TEMP/view.err" || { cat "$RUNNER_TEMP/view.err"; echo "$name: cannot read npm's latest"; [ ${#failed[@]} -eq 0 ] || echo "Not published: ${failed[*]}"; exit 1; }
              latest=""
            fi
            tag=latest
            if [[ "$version" == *-* ]]; then
              echo "$name@$version is a prerelease: published as next"
              tag=next
            else
              older=$(node -e 'const n=(v)=>v.split("-")[0].split(".").map(Number);const [a,b]=[n(process.argv[1]),n(process.argv[2]||"0.0.0")];for(let i=0;i<3;i++){if(a[i]!==b[i]){console.log(a[i]<b[i]);process.exit()}}console.log(false)' "$version" "$latest")
              if [ "$older" = true ]; then echo "$name@$version is older than latest $latest: published as backport"; tag=backport; fi
            fi
            published=true
            npm publish "./$t" --provenance --access public --tag "$tag" 2>"$RUNNER_TEMP/publish.err" || published=false
            cat "$RUNNER_TEMP/publish.err" >&2
            if [ "$published" = true ]; then
              echo "$name@$version" >> "$RUNNER_TEMP/on-npm"
              published_now+=("$name@$version")
            else
              hint=""
              grep -q E404 "$RUNNER_TEMP/publish.err" && hint=" (a 404 on publish usually means npmjs.com has no trusted publisher for it: add $GITHUB_REPOSITORY, workflow ci.yml, environment npm)"
              echo "::error::$name@$version was not published$hint"
              failed+=("$name@$version")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Not published: ${failed[*]}"
            exit 1
          fi

      # Also after a partly failed Publish: tags what Publish published or found already on npm
      # (its on-npm list, not a fresh registry read, which can lag right after a publish).
      - name: Releases
        if: ${{ !cancelled() && steps.publish.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && continue
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes "Published to npm."
          done < "$RUNNER_TEMP/on-npm"

  # What this run published reaches the other repositories of the statewalker-release App's
  # installation as a `statewalker-published` dispatch; each dependent then moves its lockfile
  # within its ranges in a lockfile-only pull request (statewalker/statewalker-ci's
  # notify-dependents.yml and statewalker-update.yml). Also after a partly failed publish, for
  # what did go out.
  notify:
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.published != '' }}
    permissions: {}
    uses: statewalker/statewalker-ci/.github/workflows/notify-dependents.yml@main
    with:
      packages: ${{ needs.publish.outputs.published }}
    secrets: inherit
