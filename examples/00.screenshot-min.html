<!DOCTYPE html>
<html lang="en">
  <body>
    <img id="img" alt="Screenshot of the page" />
    <script type="module">
      import initDevTools from "https://unpkg.com/@statewalker/webrun-devtools@0.0.12";

      (async () => {
        const apiKey = prompt("Enter the API Key:");
        const url = prompt("Enter the URL to capture:", "https://www.google.com");
        const api = await initDevTools({ apiKey });
        try {
          const winOptions = { url, focused:true, width:1200, height:800 }
          // Listen before opening the window, so a fast load is not missed
          let win, onLoaded;
          const loaded = new Promise((resolve) => (onLoaded = resolve));
          const onUpdated = (tabId, { status }) => {
            if (status === "complete" && tabId === win?.tabs[0].id) onLoaded();
          };
          await api.tabs.onUpdated.addListener(onUpdated);
          win = await api.windows.create(winOptions);
          if ((await api.tabs.get(win.tabs[0].id)).status !== "complete") await loaded;
          await api.tabs.onUpdated.removeListener(onUpdated);
          const imgUrl = await api.tabs.captureVisibleTab(win.id, { format: "png" });
          document.querySelector("#img").src = imgUrl;

          await api.windows.remove(win.id);
        } finally {
          await api.close();
        }
      })().catch(console.error);
    </script>
  </body>
</html>
