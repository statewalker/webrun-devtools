# This repository is a single package, not a workspace — there is no `packages:` list to
# write. The file exists for one reason: pnpm 10 reads build-script policy from here, and
# reading it from `pnpm.onlyBuiltDependencies` in package.json only works when that manifest
# is the workspace root. Inside an umbrella assembly it is not, so pnpm ignores the field and
# says so on every install. Declared here, it is honoured standalone and collected by the
# assembler for the assembly root.
onlyBuiltDependencies:
  - esbuild

catalog:
  "@changesets/cli": ^3.0.3
  "@biomejs/biome": ^2.5.15
  "@statewalker/getset": ^0.2.6
  "@statewalker/utils": ^0.4.2
  "@statewalker/webrun-http": ^0.1.0
  "@statewalker/webrun-ports": ^0.4.0
  "idb-keyval": ^6.3.0
  "nodemon": ^3.1.14
  "open-props": ^1.7.23
  "semver": ^7.8.5
  "typescript": ^7.0.2
  "vite": ^8.3.2
